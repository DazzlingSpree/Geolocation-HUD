<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MYSTHOOD">
    <meta name="theme-color" content="#000000">
    
    <title>MYSTHOOD HUD // TELEMETRY</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --crimson: #ff003c;
            --crimson-dim: #8b0021;
            --black: #050505;
            --hud-bg: rgba(5, 5, 5, 0.85);
            --glow: 0 0 10px rgba(255, 0, 60, 0.6);
            --glow-intense: 0 0 20px rgba(255, 0, 60, 0.9);
        }

        body {
            background-color: var(--black);
            color: var(--crimson);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Vignette */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 120%);
            pointer-events: none;
            z-index: 90;
        }

        h1, h2, .title-font {
            font-family: 'Chakra Petch', sans-serif;
        }

        /* Geometric Borders */
        .cyber-border {
            position: relative;
            background: rgba(20, 0, 5, 0.6);
            border: 1px solid var(--crimson-dim);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .cyber-border::before, .cyber-border::after {
            content: ''; position: absolute; width: 8px; height: 8px; border: 2px solid var(--crimson);
        }
        .cyber-border::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .cyber-border::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* Buttons */
        .btn-cyber {
            background: linear-gradient(45deg, transparent 5%, var(--crimson-dim) 5%);
            color: white;
            box-shadow: 6px 0px 0px #00e6f6;
            transition: all 0.2s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            border: none;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .btn-cyber-primary {
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid var(--crimson);
            color: var(--crimson);
            transition: all 0.2s;
            text-transform: uppercase;
            text-shadow: var(--glow);
            box-shadow: inset 0 0 10px rgba(255, 0, 60, 0.2);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        
        .btn-cyber-primary:active {
            background: var(--crimson);
            color: var(--black);
            box-shadow: var(--glow-intense);
        }

        /* Animations */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor-blink { animation: blink 1s step-end infinite; }
        
        @keyframes textShadowFlicker {
            0% { text-shadow: 0 0 4px rgba(255,0,60,0.5); }
            50% { text-shadow: var(--glow-intense); }
            100% { text-shadow: 0 0 4px rgba(255,0,60,0.5); }
        }
        .flicker-text { animation: textShadowFlicker 3s infinite; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--black); }
        ::-webkit-scrollbar-thumb { background: var(--crimson-dim); }

        /* Leaflet Overrides for Dark Theme */
        .leaflet-container {
            background: #050505;
            font-family: 'Share Tech Mono', monospace;
        }
        .leaflet-control-zoom { display: none; } /* Hide zoom on HUD */
        .leaflet-control-attribution { 
            background: rgba(0,0,0,0.7) !important; 
            color: var(--crimson-dim) !important;
            font-size: 8px !important;
        }
        .leaflet-control-attribution a { color: var(--crimson) !important; }

        .blip-marker {
            background-color: var(--crimson);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--crimson), 0 0 30px var(--crimson);
            border: 2px solid white;
        }
    </style>
</head>

<body class="p-4 pt-10 sm:p-6 sm:pt-12 relative z-0 flex flex-col gap-4">
    
    <!-- HEADER -->
    <header class="relative z-10 flex flex-col gap-1 border-b border-red-900/50 pb-2">
        <div class="flex justify-between items-start">
            <div class="title-font text-2xl sm:text-3xl font-bold tracking-widest text-red-600 flicker-text">
                MYSTHOOD<span class="text-white opacity-50 text-lg"> // TELEMETRY</span>
            </div>
            <div id="sys-clock" class="text-xs sm:text-sm text-red-500/70 border border-red-900 px-2 py-1 bg-red-900/10">00:00:00 UTC</div>
        </div>
        <div class="flex justify-between text-[10px] tracking-widest opacity-60">
            <span id="status-indicator">SYS.STATUS: <span class="text-white">STANDBY</span></span>
            <span>OS: <span id="os-detect">DETECTING...</span></span>
        </div>
    </header>

    <!-- TERMINAL CONSOLE -->
    <div id="terminal" class="cyber-border flex-none h-32 sm:h-40 overflow-y-auto p-3 text-xs sm:text-sm font-mono relative z-10 flex flex-col">
        <div id="log-content" class="flex-grow whitespace-pre-wrap leading-relaxed"></div>
        <div class="mt-1"><span class="text-red-500">></span> <span id="typing-line"></span><span class="cursor-blink bg-red-500 w-2 h-4 inline-block align-middle ml-1"></span></div>
    </div>

    <!-- MAIN ACTION AREA -->
    <main class="flex-grow relative z-10 flex flex-col gap-4 overflow-y-auto pb-4">
        
        <!-- INITIALIZATION BUTTON -->
        <button id="btn-engage" onclick="hud.engage()" class="btn-cyber-primary w-full py-8 text-xl sm:text-2xl title-font font-bold flex flex-col items-center justify-center gap-2 my-auto">
            <svg class="w-8 h-8 mb-1 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
            ENGAGE TELEMETRY
        </button>

        <!-- ACTIVE HUD (Hidden initially) -->
        <div id="active-hud" class="hidden flex-col gap-4 h-full">
            
            <!-- TELEMETRY READOUTS -->
            <div class="grid grid-cols-2 gap-3">
                <div class="cyber-border p-2 sm:p-3 bg-red-950/10">
                    <span class="text-[9px] sm:text-[10px] text-white/50 block mb-1 tracking-widest">LATITUDE</span>
                    <span id="tel-lat" class="text-lg sm:text-xl font-bold tracking-wider text-shadow">--.------</span>
                </div>
                <div class="cyber-border p-2 sm:p-3 bg-red-950/10">
                    <span class="text-[9px] sm:text-[10px] text-white/50 block mb-1 tracking-widest">LONGITUDE</span>
                    <span id="tel-lng" class="text-lg sm:text-xl font-bold tracking-wider text-shadow">--.------</span>
                </div>
                <div class="cyber-border p-2 sm:p-3 bg-red-950/10">
                    <span class="text-[9px] sm:text-[10px] text-white/50 block mb-1 tracking-widest">ACCURACY</span>
                    <span id="tel-acc" class="text-base sm:text-lg font-bold tracking-wider">-- M</span>
                </div>
                <div class="cyber-border p-2 sm:p-3 bg-red-950/10">
                    <span class="text-[9px] sm:text-[10px] text-white/50 block mb-1 tracking-widest">SPEED (EST)</span>
                    <span id="tel-spd" class="text-base sm:text-lg font-bold tracking-wider">-- KM/H</span>
                </div>
            </div>

            <!-- MAP CONTAINER -->
            <div class="cyber-border flex-grow min-h-[200px] relative p-1">
                <div class="absolute top-0 left-0 w-full h-full z-20 pointer-events-none shadow-[inset_0_0_20px_rgba(0,0,0,1)] border border-red-900/30"></div>
                <div id="map" class="w-full h-full z-10 filter grayscale sepia-[.3] hue-rotate-[320deg] contrast-125"></div>
            </div>

            <!-- ROUTING ACTIONS -->
            <div class="grid grid-cols-2 gap-3 mt-auto">
                <button onclick="hud.route('apple')" class="btn-cyber-primary py-3 text-[10px] sm:text-xs title-font font-bold tracking-widest">
                    APPLE MAPS UPLINK
                </button>
                <button onclick="hud.route('google')" class="btn-cyber-primary py-3 text-[10px] sm:text-xs title-font font-bold tracking-widest">
                    GOOGLE MAPS UPLINK
                </button>
            </div>
        </div>

    </main>

    <script>
        const hud = {
            state: {
                lat: null,
                lng: null,
                watchId: null,
                mapInitialized: false,
                marker: null,
                map: null
            },
            ui: {
                clock: document.getElementById('sys-clock'),
                os: document.getElementById('os-detect'),
                status: document.getElementById('status-indicator'),
                log: document.getElementById('log-content'),
                terminal: document.getElementById('terminal'),
                typingLine: document.getElementById('typing-line'),
                btnEngage: document.getElementById('btn-engage'),
                activeHud: document.getElementById('active-hud'),
                lat: document.getElementById('tel-lat'),
                lng: document.getElementById('tel-lng'),
                acc: document.getElementById('tel-acc'),
                spd: document.getElementById('tel-spd')
            },

            init() {
                this.detectOS();
                setInterval(() => {
                    this.ui.clock.innerText = new Date().toISOString().split('T')[1].split('.')[0] + ' UTC';
                }, 1000);

                this.bootSequence();
            },

            detectOS() {
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                    this.ui.os.innerText = "iOS KERNEL";
                } else if (/android/i.test(userAgent)) {
                    this.ui.os.innerText = "ANDROID KERNEL";
                } else {
                    this.ui.os.innerText = "UNKNOWN PLATFORM";
                }
            },

            async printLog(msg, type = 'info') {
                const time = new Date().toISOString().split('T')[1].split('.')[0];
                const prefix = type === 'error' ? '[ERR]' : type === 'warn' ? '[WRN]' : '[SYS]';
                let colorClass = type === 'error' ? 'text-red-500 font-bold bg-red-900/20' : 
                                 type === 'warn' ? 'text-yellow-500' : 'text-red-500/80';
                
                const entry = document.createElement('div');
                entry.className = colorClass;
                entry.innerText = `${prefix} ${time} :: ${msg}`;
                
                this.ui.log.appendChild(entry);
                this.ui.terminal.scrollTop = this.ui.terminal.scrollHeight;
            },

            async typeLine(text, speed = 20) {
                this.ui.typingLine.innerText = '';
                for (let i = 0; i < text.length; i++) {
                    this.ui.typingLine.innerText += text.charAt(i);
                    await new Promise(r => setTimeout(r, speed));
                }
                this.printLog(text);
                this.ui.typingLine.innerText = '';
            },

            async bootSequence() {
                await this.typeLine("INITIALIZING MYSTHOOD KERNEL v4.1.0...");
                await this.typeLine("LOADING ENCRYPTION MODULES... OK");
                await this.typeLine("CHECKING HARDWARE SENSORS...");
                
                if ("geolocation" in navigator) {
                    await this.typeLine("GNSS MODULE: DETECTED. READY FOR UPLINK.");
                } else {
                    await this.typeLine("GNSS MODULE: NOT FOUND. SYSTEM FAILURE IMMINENT.", "error");
                    this.ui.btnEngage.disabled = true;
                    this.ui.btnEngage.style.opacity = 0.3;
                    this.ui.status.innerHTML = `SYS.STATUS: <span class="text-red-500 font-bold">FAULT</span>`;
                }
            },

            async engage() {
                this.ui.btnEngage.classList.add('hidden');
                this.ui.btnEngage.classList.remove('flex');
                
                this.ui.status.innerHTML = `SYS.STATUS: <span class="text-yellow-500 font-bold">ACQUIRING</span>`;
                await this.typeLine("AUTHORIZATION ACCEPTED. REQUESTING SENSOR ACCESS...");
                
                if (window.isSecureContext === false && window.location.hostname !== 'localhost' && window.location.protocol !== 'file:') {
                    this.printLog("INSECURE CONTEXT DETECTED. BROWSER MAY BLOCK GPS POLL.", "warn");
                }

                this.state.watchId = navigator.geolocation.watchPosition(
                    (pos) => this.handleTelemetry(pos),
                    (err) => this.handleError(err),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
                );
            },

            handleTelemetry(position) {
                const { latitude, longitude, accuracy, speed } = position.coords;
                
                // First lock sequence
                if (!this.state.lat) {
                    this.ui.status.innerHTML = `SYS.STATUS: <span class="text-white font-bold">LOCKED</span>`;
                    this.ui.activeHud.classList.remove('hidden');
                    this.ui.activeHud.classList.add('flex');
                    this.printLog("SATELLITE LOCK ACQUIRED. STREAMING TELEMETRY.");
                    this.initMap(latitude, longitude);
                } else {
                    this.printLog(`POLL: [${latitude.toFixed(4)}, ${longitude.toFixed(4)}] A:${Math.round(accuracy)}m`);
                }

                this.state.lat = latitude;
                this.state.lng = longitude;

                // Update DOM
                this.ui.lat.innerText = latitude.toFixed(6);
                this.ui.lng.innerText = longitude.toFixed(6);
                this.ui.acc.innerText = accuracy.toFixed(1) + " M";
                
                if (speed !== null && speed >= 0) {
                    const kmh = speed * 3.6;
                    this.ui.spd.innerText = kmh.toFixed(1) + " KM/H";
                } else {
                    this.ui.spd.innerText = "0.0 KM/H";
                }

                this.updateMap(latitude, longitude);
            },

            handleError(error) {
                let reason = "UNKNOWN EXCEPTION";
                switch(error.code) {
                    case 1: reason = "PERMISSION DENIED BY USER OR OS"; break;
                    case 2: reason = "POSITION UNAVAILABLE (NO SAT LOCK)"; break;
                    case 3: reason = "TIMEOUT EXCEEDED"; break;
                }
                this.printLog(`GNSS FAULT: ${reason}`, "error");
                this.ui.status.innerHTML = `SYS.STATUS: <span class="text-red-500 font-bold">LINK LOST</span>`;
                
                // Allow user to try again
                if (!this.state.lat) {
                    this.ui.btnEngage.classList.remove('hidden');
                    this.ui.btnEngage.classList.add('flex');
                    this.ui.btnEngage.innerHTML = "RETRY UPLINK";
                }
            },

            initMap(lat, lng) {
                if (this.state.mapInitialized) return;

                // Create map with specific interaction rules for a HUD
                this.state.map = L.map('map', {
                    zoomControl: false,
                    attributionControl: true,
                    dragging: false, // Keep it centered like a HUD
                    touchZoom: false,
                    scrollWheelZoom: false,
                    doubleClickZoom: false,
                    boxZoom: false
                }).setView([lat, lng], 16);

                // Dark matter tiles from CartoDB - fits the aesthetic
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                    subdomains: 'abcd',
                    maxZoom: 20
                }).addTo(this.state.map);

                // Custom blinking dot marker
                const blipIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: "<div class='blip-marker' style='width: 14px; height: 14px;'></div>",
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });

                this.state.marker = L.marker([lat, lng], {icon: blipIcon}).addTo(this.state.map);
                this.state.mapInitialized = true;
                
                // Crucial fix for Leaflet rendering inside a dynamically shown container
                setTimeout(() => {
                    this.state.map.invalidateSize();
                }, 100);
            },

            updateMap(lat, lng) {
                if (this.state.mapInitialized && this.state.map && this.state.marker) {
                    const newLatLng = new L.LatLng(lat, lng);
                    this.state.marker.setLatLng(newLatLng);
                    this.state.map.panTo(newLatLng, {animate: true, duration: 0.5});
                }
            },

            route(service) {
                if (!this.state.lat || !this.state.lng) {
                    this.printLog("CANNOT ROUTE: NO COORDINATE LOCK", "warn");
                    return;
                }

                this.printLog(`EXPORTING VECTOR TO ${service.toUpperCase()} MAPS...`);
                
                if (service === 'apple') {
                    // Apple maps URL scheme
                    window.location.href = `http://maps.apple.com/?ll=${this.state.lat},${this.state.lng}&q=Target_Vector`;
                } else if (service === 'google') {
                    // Google Maps URL scheme
                    window.open(`https://www.google.com/maps/search/?api=1&query=${this.state.lat},${this.state.lng}`, '_blank');
                }
            }
        };

        // Boot
        window.onload = () => hud.init();
    </script>
</body>
</html>
